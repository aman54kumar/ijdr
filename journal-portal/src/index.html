<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IJDR - Indian Journal of Development Research</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f3a66" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved/OS theme before first paint (no flash of wrong theme) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ijdr-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var d = document.documentElement;
          d.setAttribute('data-theme', t);
          d.setAttribute('data-bs-theme', t);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Indian Journal of Development Research (IJDR) - A premier bi-annual academic journal published by Institute of Development Studies, Varanasi. ISSN: 2249-104X"
    />
    <meta
      name="keywords"
      content="development research, academic journal, IJDR, Indian Journal of Development Research, peer-reviewed, academic publishing, research papers"
    />
    <meta name="author" content="Institute of Development Studies, Varanasi" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ijdrpub.in/" />
    <meta
      property="og:title"
      content="IJDR - Indian Journal of Development Research"
    />
    <meta
      property="og:description"
      content="Premier bi-annual academic journal focusing on development research. Published by Institute of Development Studies, Varanasi. ISSN: 2249-104X"
    />
    <meta
      property="og:image"
      content="https://ijdrpub.in/assets/images/ijdr-social-preview.jpg"
    />
    <meta
      property="og:site_name"
      content="Indian Journal of Development Research"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ijdrpub.in/" />
    <meta
      property="twitter:title"
      content="IJDR - Indian Journal of Development Research"
    />
    <meta
      property="twitter:description"
      content="Premier bi-annual academic journal focusing on development research. Published by Institute of Development Studies, Varanasi. ISSN: 2249-104X"
    />
    <meta
      property="twitter:image"
      content="https://ijdrpub.in/assets/images/ijdr-social-preview.jpg"
    />

    <!-- Academic/Scholar Meta Tags -->
    <meta
      name="citation_journal_title"
      content="Indian Journal of Development Research"
    />
    <meta name="citation_journal_abbrev" content="IJDR" />
    <meta name="citation_issn" content="2249-104X" />
    <meta
      name="citation_publisher"
      content="Institute of Development Studies, Varanasi"
    />
    <meta
      name="DC.Publisher"
      content="Institute of Development Studies, Varanasi"
    />
    <meta
      name="DC.Rights"
      content="Copyright Institute of Development Studies, Varanasi"
    />

  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
