<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IJDR - Indian Journal of Development Research</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f3a66" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved/OS theme before first paint (no flash of wrong theme) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ijdr-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var d = document.documentElement;
          d.setAttribute('data-theme', t);
          d.setAttribute('data-bs-theme', t);
        } catch (e) {}
      })();
    </script>

    <!-- Structured data: journal + publisher + site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Periodical",
            "@id": "https://ijdrpub.in/#journal",
            "name": "Indian Journal of Development Research",
            "alternateName": "IJDR",
            "url": "https://ijdrpub.in/",
            "issn": "2249-104X",
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "description": "A peer-reviewed, open-access, bi-annual journal on development studies, public policy and sustainable growth.",
            "publisher": { "@id": "https://ijdrpub.in/#publisher" },
            "image": "https://ijdrpub.in/assets/images/ijdr-social-preview.jpg"
          },
          {
            "@type": "Organization",
            "@id": "https://ijdrpub.in/#publisher",
            "name": "Institute of Development Studies, Varanasi",
            "url": "https://ijdrpub.in/publisher",
            "logo": "https://ijdrpub.in/icon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://ijdrpub.in/#website",
            "url": "https://ijdrpub.in/",
            "name": "Indian Journal of Development Research",
            "inLanguage": "en",
            "publisher": { "@id": "https://ijdrpub.in/#publisher" }
          }
        ]
      }
    </script>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Indian Journal of Development Research (IJDR): a peer-reviewed, open-access journal on development studies from the Institute of Development Studies, Varanasi."
    />
    <meta
      name="keywords"
      content="development research, academic journal, IJDR, Indian Journal of Development Research, peer-reviewed, academic publishing, research papers"
    />
    <meta name="author" content="Institute of Development Studies, Varanasi" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ijdrpub.in/" />
    <meta
      property="og:title"
      content="IJDR - Indian Journal of Development Research"
    />
    <meta
      property="og:description"
      content="Premier bi-annual academic journal focusing on development research. Published by Institute of Development Studies, Varanasi. ISSN: 2249-104X"
    />
    <meta
      property="og:image"
      content="https://ijdrpub.in/assets/images/ijdr-social-preview.jpg"
    />
    <meta
      property="og:site_name"
      content="Indian Journal of Development Research"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ijdrpub.in/" />
    <meta
      property="twitter:title"
      content="IJDR - Indian Journal of Development Research"
    />
    <meta
      property="twitter:description"
      content="Premier bi-annual academic journal focusing on development research. Published by Institute of Development Studies, Varanasi. ISSN: 2249-104X"
    />
    <meta
      property="twitter:image"
      content="https://ijdrpub.in/assets/images/ijdr-social-preview.jpg"
    />

    <!-- Academic/Scholar Meta Tags -->
    <meta
      name="citation_journal_title"
      content="Indian Journal of Development Research"
    />
    <meta name="citation_journal_abbrev" content="IJDR" />
    <meta name="citation_issn" content="2249-104X" />
    <meta
      name="citation_publisher"
      content="Institute of Development Studies, Varanasi"
    />
    <meta
      name="DC.Publisher"
      content="Institute of Development Studies, Varanasi"
    />
    <meta
      name="DC.Rights"
      content="Copyright Institute of Development Studies, Varanasi"
    />

  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
